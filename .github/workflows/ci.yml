name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, test, build (shared/api/dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit + integration tests (shared, api, dashboard)
        run: pnpm -r run test

      - name: Build dashboard
        run: pnpm --filter @pdm/dashboard run build

      - name: Install Playwright browser
        run: pnpm --filter @pdm/dashboard exec playwright install --with-deps chromium

      - name: Dashboard e2e (demo mode)
        run: pnpm --filter @pdm/dashboard run test:e2e

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
